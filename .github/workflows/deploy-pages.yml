name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No source commits are created by this workflow.
permissions:
  contents: read

# Do not interrupt an already running Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs from a feature branch must not replace the production site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js for local checks and file copying
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      # Only Node.js built-ins are used; npm install / npm ci is not needed.
      - name: Test source, routes and packaging
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Copies only public files. It does NOT merge JavaScript/CSS into HTML.
      - name: Prepare separate static files
        run: npm run package:pages

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
